# Static analysis config for this package.
# See https://dart.dev/tools/analysis and https://dart.dev/lints for the full
# list of lints and what each one enforces.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Uncomment to opt out of a rule across the whole package.
    # avoid_print: false
